<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الصفحة مو موجودة — دحوم</title>
<script>(function(){var t=null;try{t=localStorage.getItem('dahoom_theme');}catch(e){}if(t!=='day'&&t!=='night'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'day':'night';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="icon" type="image/png" sizes="32x32" href="/dahoom/assets/app/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dahoom/css/style.css">
<style>
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text)}
  .nf{max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .nf-n{font-family:var(--num);font-weight:900;font-size:clamp(4rem,18vw,7rem);line-height:1;color:var(--brand)}
  .nf h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,6vw,2.4rem);margin:0}
  .nf p{color:var(--mute);margin:0;line-height:1.7}
  .nf-band{width:100%;height:10px;background:var(--sadu-band) 0 0/22px 10px;opacity:.9;border-radius:4px}
  .nf .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
</style>
</head>
<body>
  <main class="nf">
    <div class="nf-n">404</div>
    <h1>الصفحة هذي مو موجودة</h1>
    <p>يمكن الرابط قديم أو فيه حرف ناقص. ارجع للرئيسية وسوّ جلسة، أو ادخل جلسة بالكود.</p>
    <div class="nf-band" aria-hidden="true"></div>
    <div class="row"><a class="btn btn-hype big" href="/dahoom/">الرئيسية</a><a class="btn big" href="/dahoom/remote.html">ادخل جلسة</a></div>
  </main>
</body>
</html>

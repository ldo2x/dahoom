<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120A24">
<title>دحوم — الجوال</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF3D81'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%D8%AF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/remote.css">
</head>
<body class="remote">

<!-- الدخول بالكود -->
<section id="r-join" class="r-screen">
  <div class="r-brand"><span class="brand-mark">د</span> دحوم</div>
  <h1>ادخل كود الغرفة</h1>
  <p class="muted">الكود ظاهر على الشاشة تحت زر "الجوالات"</p>
  <input id="r-code" class="r-code-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" inputmode="text">
  <button class="btn btn-hype big" id="r-go">دخول</button>
  <p class="r-err" id="r-err"></p>
</section>

<!-- اختيار الفريق -->
<section id="r-pick" class="r-screen hidden">
  <div class="r-brand"><span class="brand-mark">د</span> دحوم · <span id="r-room-lbl"></span></div>
  <h1>وش فريقك؟</h1>
  <div class="r-teams" id="r-teams"></div>
</section>

<!-- تسجيل اللاعب -->
<section id="r-reg" class="r-screen hidden">
  <div class="r-brand"><span class="brand-mark">د</span> دحوم · <span id="r-reg-team"></span></div>
  <h1>مين انت؟</h1>
  <input type="text" id="r-name" maxlength="16" placeholder="اكتب اسمك" autocomplete="nickname">
  <div class="lbl">اختر شكلك</div>
  <div class="r-avatars" id="r-avatars"></div>
  <button class="btn btn-hype big" id="r-reg-go">يلا</button>
  <p class="r-err" id="r-reg-err"></p>
</section>

<!-- الشاشة الرئيسية -->
<section id="r-main" class="r-screen hidden">
  <header class="r-head" id="r-head"></header>
  <div class="r-phase" id="r-phase"></div>
  <div class="r-charade hidden" id="r-charade"></div>
  <button class="r-buzz" id="r-buzz" disabled><span class="bz-main">BUZZ</span><span class="bz-sub" id="r-buzz-sub"></span></button>
  <div class="fx-tags" id="r-fx"></div>
  <div class="r-hand-wrap" id="r-hand-wrap">
    <div class="r-hand-lbl" id="r-hand-lbl"></div>
    <div class="r-hand" id="r-hand"></div>
  </div>
  <div class="r-scores" id="r-scores"></div>
  <button class="btn ghost small r-switch" id="r-switch">تغيير الفريق</button>
</section>

<div class="r-status hidden" id="r-status"></div>
<div class="r-sheet hidden" id="r-sheet"><div class="r-sheet-in" id="r-sheet-in"></div></div>

<script src="js/vendor/peerjs.min.js"></script>
<script src="data/cards.js"></script>
<script src="js/remote.js"></script>
</body>
</html>

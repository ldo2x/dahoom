<body class="remote">

<!-- شريط علوي ثابت بكل الشاشات: الشعار وزر الوضع -->
<header class="r-bar">
  <span class="r-logo"><span class="brand-mark">د</span> دحوم</span>
  <button class="btn ghost small btn-theme" aria-label="تبديل الوضع"></button>
</header>

<!-- الدخول بالكود -->
<section id="r-join" class="r-screen">
  <div class="acc-slot r-acc" id="acc-badge"></div>
  <h1>ادخل جلسة</h1>
  <p class="muted">اكتب كود الجلسة اللي وصلك، أو اختر من الجلسات المفتوحة تحت</p>
  <div class="r-codebox"><input id="r-code" class="r-code-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="••••" inputmode="text" aria-label="كود الجلسة">
  <button class="btn btn-hype big" id="r-go">دخول</button></div>
  <p class="r-err" id="r-err"></p>
  <section class="r-lobby">
    <div class="r-lobby-h"><b>الجلسات المفتوحة</b><a class="btn small" href="index.html">سوّ جلستك</a></div>
    <div class="jl-list" id="r-rooms"><p class="muted small">نجيب الجلسات…</p></div>
  </section>
  <nav class="legal-links small muted" aria-label="روابط"><a href="privacy.html">الخصوصية</a> · <a href="terms.html">الشروط</a></nav>
</section>

<!-- اختيار الفريق -->
<section id="r-pick" class="r-screen hidden">
  <div class="r-brand">الغرفة <span id="r-room-lbl" class="r-room"></span></div>
  <div class="r-sess-mini" id="r-sess-mini"></div>
  <h1>وش فريقك؟</h1>
  <div class="r-teams" id="r-teams"></div>
  <form class="r-newteam hidden" id="r-newteam"><input type="text" id="r-newteam-name" maxlength="18" placeholder="اسم فريق جديد" autocomplete="off"><button class="btn btn-mint" type="submit">أنشئ فريق</button></form>
</section>

<!-- تسجيل اللاعب -->
<section id="r-reg" class="r-screen hidden">
  <div class="r-brand"><span id="r-reg-lbl">فريقك</span> <span id="r-reg-team"></span></div>
  <h1>مين انت؟</h1>
  <input type="text" id="r-name" maxlength="16" placeholder="اكتب اسمك" autocomplete="nickname">
  <div class="lbl">اختر شكلك</div>
  <div class="r-avatars" id="r-avatars"></div>
  <button class="btn btn-hype big" id="r-reg-go">يلا</button>
  <button class="btn ghost hidden" id="r-reg-back">رجوع بدون تغيير</button>
  <p class="r-err" id="r-reg-err"></p>
</section>

<!-- الشاشة الرئيسية: عمود اللعب + عمود الجلسة (بالكمبيوتر جنب بعض، بالجوال تحت بعض) -->
<section id="r-main" class="r-screen hidden">
  <div class="r-layout">
    <div class="r-col">
      <header class="r-head" id="r-head"></header>
      <div class="r-wait r-hide" id="r-wait"></div>
      <div class="r-timer r-hide" id="r-timer" aria-live="off">
        <div class="rt-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><b class="rt-num" id="rt-num">0</b></div>
        <div class="rt-side"><span class="rt-lbl" id="rt-lbl">الوقت</span><div class="rt-bar"><i id="rt-bar"></i></div></div>
      </div>
      <div class="r-phase" id="r-phase"></div>
      <div class="r-view r-hide" id="r-view"></div>
      <div class="r-ask r-hide" id="r-ask"></div>
      <div class="r-hmwrap r-hide" id="r-hmwrap">
        <div class="r-hm" id="r-hm"></div>
        <div class="r-hmside" id="r-hmside"><div class="r-hmside-in">
          <div class="r-hmme" id="r-hmme"></div>
          <div class="r-hmtabs" id="r-hmtabs" role="tablist">
            <button type="button" role="tab" data-tab="mine" class="on" aria-selected="true">عقاراتي</button>
            <button type="button" role="tab" data-tab="players">اللاعبين</button>
            <button type="button" role="tab" data-tab="trades">الصفقات<b class="r-hmtabn" id="r-hmtrn"></b></button>
            <button type="button" role="tab" data-tab="log">وش صار</button>
          </div>
          <div class="r-hmpanes">
            <div class="r-hmpane on" data-pane="mine" id="r-hmmine"></div>
            <div class="r-hmpane r-hmpl" data-pane="players" id="r-hmpl"></div>
            <section class="r-hmpane r-hmtr" data-pane="trades" id="r-hmtr"></section>
            <div class="r-hmpane" data-pane="log"><div class="r-feed r-hmlog" id="r-hmlog"></div></div>
          </div>
        </div></div>
      </div>
      <button class="r-hmaskjump r-hide" id="r-hmaskjump" type="button">دورك تقرر — ارجع للوحة</button>
      <div class="r-final hidden" id="r-final"></div>
      <div class="r-charade hidden" id="r-charade"></div>
      <div class="r-rasm hidden" id="r-rasm"></div>
      <div class="r-sq hidden" id="r-sq"></div>
      <!-- خانة الفعل: ارتفاع ثابت، ومحتواها يتبدل حسب المرحلة (البز / اليد / سطر حالة) عشان ما تتحرك الشاشة -->
      <div class="r-slot" id="r-slot" data-mode="buzz">
        <button class="r-buzz" id="r-buzz" disabled><span class="bz-main">بزّ</span><span class="bz-sub" id="r-buzz-sub"></span></button>
        <div class="r-slot-msg" id="r-slot-msg"></div>
        <div class="r-hand-wrap" id="r-hand-wrap">
          <div class="r-hand-lbl" id="r-hand-lbl"></div>
          <div class="r-hand" id="r-hand"></div>
        </div>
      </div>
      <div class="fx-tags" id="r-fx"></div>
    </div>
    <aside class="r-side">
      <details class="r-card r-sess" id="r-sess" open><summary id="r-sess-sum"></summary><div id="r-sess-body"></div></details>
      <div class="r-scores" id="r-scores"></div>
      <section class="r-card r-feedbox"><h4>وش صار <small id="r-feed-n"></small></h4><div class="r-feed" id="r-feed"><p class="muted small">هنا يطلع كل شي يصير باللعبة أول بأول</p></div></section>
      <div class="r-foot"><button class="btn ghost small" id="r-report">بلّغ عن مشكلة</button><button class="btn ghost small r-switch" id="r-switch">تغيير الفريق</button></div>
    </aside>
  </div>
</section>

<div class="r-status hidden" id="r-status"></div>
<div class="r-sheet hidden" id="r-sheet"><div class="r-sheet-in" id="r-sheet-in"></div></div>

<script src="js/telemetry.js?v=202611221700"></script>
<script src="js/draw.js?v=202611221700"></script>
<script src="js/rules.js?v=202611221700"></script>
<script src="js/sqart.js?v=202611221700"></script>
<script src="js/remote.js?v=202611221700"></script>
</body>
</html>

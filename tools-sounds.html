<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>أصوات المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D0B14; --card:#17141F; --line:#2A2535; --ink:#F3F0F8; --mute:#A39CB3; --acc:#FFC23A; --hot:#FF3D81; }
  @media (prefers-color-scheme: light){ :root{ --bg:#ECEAF1; --card:#FFFFFF; --line:#DAD6E3; --ink:#1A1622; --mute:#6B6478; --acc:#B07800; --hot:#D61F63; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif; }
  main{ max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1{ font-size:28px; margin:0 0 4px; }
  .lead{ color:var(--mute); margin:0 0 20px; }
  .bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 24px; }
  .bar label{ display:flex; gap:8px; align-items:center; color:var(--mute); }
  h2{ font-size:15px; letter-spacing:.02em; color:var(--acc); margin:28px 0 10px; }
  .row{ display:grid; grid-template-columns:auto 1fr auto; gap:4px 14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin:0 0 8px; }
  .row b{ font-weight:700; }
  .row .when{ grid-column:2; color:var(--mute); font-size:14px; }
  .row code{ font-size:12px; color:var(--mute); direction:ltr; }
  .row .meta{ grid-row:1 / span 2; grid-column:3; text-align:left; font-size:12px; color:var(--mute); direction:ltr; white-space:nowrap; }
  .row .meta.bad{ color:var(--hot); font-weight:700; }
  button{ font:inherit; cursor:pointer; border:0; border-radius:999px; padding:8px 16px; background:var(--hot); color:#fff; font-weight:700; }
  button.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .row button{ grid-row:1 / span 2; width:44px; height:44px; padding:0; display:grid; place-items:center; }
  .row button svg{ width:16px; height:16px; fill:currentColor; }
  .row.playing{ border-color:var(--acc); }
  @media (max-width:520px){ .row .meta{ display:none; } .row{ grid-template-columns:auto 1fr; } }
</style>
</head>
<body>
<main>
  <h1>أصوات المنصة</h1>
  <p class="lead">كل صوت هنا أصلي ويتولّد بالمتصفح وقت التشغيل — ما فيه ولا ملف من برا. اضغط أي واحد تسمعه بنفس العلو اللي يطلع فيه باللعبة.</p>
  <div class="bar">
    <button id="all">شغّلها كلها ورا بعض</button>
    <button class="ghost" id="stop">وقّف</button>
    <label>العلو <input type="range" id="vol" min="0" max="100" value="40"></label>
  </div>
  <div id="list"></div>
</main>
<script src="js/core.js"></script>
<script>
(function(){
  const D = window.Dahoom;
  // الاسم ← [القسم، اسم الصوت، متى يطلع]
  const META = {
    pop:['الواجهة','ضغطة','التنقل بين الشاشات والأزرار'], tick:['الواجهة','نقرة','اختيار صغير، خطوة القطعة، العدّاد العادي'],
    bling:['الواجهة','تم','تأكيد أو تلميح'], notify:['الواجهة','تنبيه','تخمين قريب في «ارسم»'],
    jingle:['الواجهة','دخول المنصة','زر الدخول بأول شاشة — بصمة المنصة على مقام الراست'],
    join:['الواجهة','لاعب انضاف','لاعب جديد باللوبي'], connect:['الواجهة','جوال اتصل','جوال فريق دخل الغرفة'],
    turn:['الدور والوقت','بداية دور','دور فريق أو لاعب جديد'], levelup:['الدور والوقت','لفة جديدة','بداية لفة أو مرحلة'],
    buzzin:['الدور والوقت','أول من ضغط','أول فريق يضغط الجرس'], clockloop:['الدور والوقت','إيقاع الوقت','يتكرر تحت عدّاد السؤال (إيقاع المقسوم)'],
    countdown:['الدور والوقت','آخر الثواني','آخر ٣ ثواني بالعدّاد'], buzzer:['الدور والوقت','خلص الوقت','نهاية العدّاد'],
    correct:['صح وغلط','صح','إجابة صحيحة'], wrong:['صح وغلط','غلط','إجابة غلط'], fail:['صح وغلط','فشل','تحدي ما نجح، إفلاس'],
    steal:['صح وغلط','سرقة','فريق سرق السؤال'], reveal:['صح وغلط','جاهز','الممثل أو الرسام جاهز'],
    final_round:['صح وغلط','اللفة الأخيرة','فريق وصل الهدف'],
    streak2:['صح وغلط','سلسلة ٢','نجاحين ورا بعض'], streak3:['صح وغلط','سلسلة ٣','ثلاث نجاحات'], streak4:['صح وغلط','سلسلة ٤','أربع نجاحات'], streak5:['صح وغلط','سلسلة ٥','خمس نجاحات'], streak6:['صح وغلط','سلسلة ٦+','ست وأكثر'],
    coin:['الفلوس','فلوس دخلت','نقاط أو ريالات انضافت'], coin_big:['الفلوس','القطة','أخذ القطة، فاز بمزاد'], pay:['الفلوس','فلوس طلعت','إيجار، مخالفة، حظ سيئ'],
    bonus:['الفلوس','بونص','دور إضافي، فك رهن، لقب'], buy:['الفلوس','شراء','اشترى مدينة'], build:['الفلوس','بناء','بنى في مدينة'],
    deal:['الفلوس','صفقة','تمت صفقة بين لاعبين'], saher:['الفلوس','ساهر','وقف على ساهر'], snatch:['الفلوس','نشل','نشل أو استحواذ'],
    out:['الفلوس','طلع','لاعب طلع من المجلس'],
    card:['البطاقات والنرد','سحب بطاقة','بطاقة انسحبت أو تبدلت'], card_play:['البطاقات والنرد','بطاقة عادية','لعب بطاقة زرقا'],
    card_rare:['البطاقات والنرد','بطاقة صفرا','لعب بطاقة صفرا'], card_legend:['البطاقات والنرد','بطاقة حمرا','لعب بطاقة أسطورية'],
    card_curse:['البطاقات والنرد','بطاقة سودا','لعب بطاقة سودا'], suspense:['البطاقات والنرد','تشويق','ثانية قبل كشف البطاقة'],
    dice_roll:['البطاقات والنرد','رمي النرد','النرد يتدحرج'], dice_land:['البطاقات والنرد','النرد وقف','النرد استقر'],
    whoosh:['البطاقات والنرد','طيران','تبديل، طيران، هدم'], deny:['البطاقات والنرد','مرفوض','بطاقة انحرقت، صفقة انرفضت، صد'],
    challenge:['ما أصدقك','ما أصدقك!','لحظة التحدي — توتر طالع وصفعة'], event:['ما أصدقك','حدث المجلس','حدث جديد، بداية مزاد'],
    drums:['الحماس والفوز','يلا نبدأ','قبل ترتيب الفرق والتتويج'], drumroll:['الحماس والفوز','طبل','قبل إعلان كل لقب'],
    cheer:['الحماس والفوز','بداية المباراة','زر ابدأ'], win:['الحماس والفوز','الفوز','شاشة الفايز'], applause:['الحماس والفوز','تصفيق','بعد إعلان الفايز (صفقة على الإيقاع)'],
  };
  const play = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
  const names = Object.keys(D.SYN);
  const groups = {};
  names.forEach(n=>{ const g=(META[n]||['أخرى'])[0]; (groups[g]=groups[g]||[]).push(n); });
  const list = document.getElementById('list');
  list.innerHTML = Object.entries(groups).map(([g,ns])=>`<h2>${g}</h2>`+ns.map(n=>{ const m=META[n]||['',n,'']; return `<div class="row" data-n="${n}">
    <button aria-label="اسمع ${m[1]}">${play}</button><div><b>${m[1]}</b> <code>${n}</code></div><div class="when">${m[2]}</div><div class="meta" data-meta></div></div>`; }).join('')).join('');

  // علو الصفحة = علو المنصة (نفس المفتاح بالجهاز)
  const vol = document.getElementById('vol');
  vol.value = Math.round((D.store.get('volume',0.4))*100);
  vol.oninput = () => D.setVolume(vol.value/100);
  function hear(n){ const r=document.querySelector(`[data-n="${n}"]`); if(r){ r.classList.add('playing'); setTimeout(()=>r.classList.remove('playing'), D.SYN[n].d*1000); }
    if(D.SYN[n].loop){ D.play(n,{volume:.6,loop:true}); setTimeout(()=>D.stop(n), D.SYN[n].d*2*1000); } else D.play(n); }
  list.addEventListener('click', e=>{ const b=e.target.closest('.row button'); if(b) hear(b.closest('.row').dataset.n); });
  let seq=null;
  document.getElementById('all').onclick = () => { clearTimeout(seq); let i=0; const nx=()=>{ if(i>=names.length) return; const n=names[i++]; hear(n); seq=setTimeout(nx, (D.SYN[n].d*(D.SYN[n].loop?2:1))*1000+450); }; nx(); };
  document.getElementById('stop').onclick = () => { clearTimeout(seq); D.stopAll(); };

  // فحص: يرسم كل وصفة أوفلاين (بدون المحدّد) ويقيس الذروة والمدة الفعلية
  async function audit(){
    const out = {};
    for(const n of names){
      const r = D.SYN[n], sr = 44100, len = Math.ceil((r.d+0.4)*sr);
      const c = new OfflineAudioContext(1, len, sr);
      D.renderSyn(n, c, c.destination, 1, 0);
      const buf = await c.startRendering(), d = buf.getChannelData(0);
      let peak=0, last=0, sum=0, cnt=0;
      for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>peak) peak=a; if(a>0.001) last=i; }
      const end = last; for(let i=0;i<=end;i++){ sum+=d[i]*d[i]; cnt++; }
      // العلو المحسوس تقريباً: نفس الوصفة من فلتر يشبه الأذن وسماعات الجوال (يقص الغامق جداً ويرفع الوسط)، وأعلى RMS على نافذة 50ms
      const c2 = new OfflineAudioContext(1, len, sr), hp=c2.createBiquadFilter(), sh=c2.createBiquadFilter();
      hp.type='highpass'; hp.frequency.value=150; sh.type='highshelf'; sh.frequency.value=1500; sh.gain.value=4; hp.connect(sh); sh.connect(c2.destination);
      D.renderSyn(n, c2, hp, 1, 0); const k = (await c2.startRendering()).getChannelData(0);
      const W=Math.round(sr*.05); let loud=0, acc=0; for(let i=0;i<k.length;i++){ acc+=k[i]*k[i]; if(i>=W) acc-=k[i-W]*k[i-W]; if(i>=W-1) loud=Math.max(loud, Math.sqrt(Math.max(0,acc)/W)); }
      out[n] = { peak:+peak.toFixed(3), rms:+Math.sqrt(sum/Math.max(1,cnt)).toFixed(3), loud:+loud.toFixed(3), tail:+(last/sr).toFixed(2), d:r.d };
      const m = document.querySelector(`[data-n="${n}"] [data-meta]`);
      if(m){ m.textContent = `${out[n].tail}s · peak ${out[n].peak}`; m.classList.toggle('bad', out[n].peak>0.9 || out[n].tail>r.d+0.15); }
    }
    return out;
  }
  window.auditSounds = audit;
  audit();
})();
</script>
</body>
</html>
